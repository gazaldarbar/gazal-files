<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6B2545" />
<title>Gazal Files</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ============ PIN LOCK SCREEN ============ -->
<section id="pin-screen" class="screen active">
  <div class="pin-brand">
    <img src="icons/icon.svg" alt="" />
    <h1>Gazal Files</h1>
  </div>
  <h2 id="pin-title" style="color:#F7F2E7; font-size:16px; font-weight:400; margin-bottom:16px;">Enter PIN</h2>
  <div id="pin-dots" class="pin-dots"></div>
  <div id="pin-message" class="pin-message"></div>
  <div class="pin-keypad">
    <button class="pin-key" data-digit="1">1</button>
    <button class="pin-key" data-digit="2">2</button>
    <button class="pin-key" data-digit="3">3</button>
    <button class="pin-key" data-digit="4">4</button>
    <button class="pin-key" data-digit="5">5</button>
    <button class="pin-key" data-digit="6">6</button>
    <button class="pin-key" data-digit="7">7</button>
    <button class="pin-key" data-digit="8">8</button>
    <button class="pin-key" data-digit="9">9</button>
    <div class="pin-key ghost"></div>
    <button class="pin-key" data-digit="0">0</button>
    <button class="pin-key" id="pin-delete">⌫</button>
  </div>
</section>

<!-- ============ APP SHELL ============ -->
<section id="app-shell" class="screen">
  <div class="topbar">
    <div id="greeting" class="greeting"></div>
    <div class="search-box" id="search-box">
      <input id="search-input" type="text" />
    </div>
  </div>

  <main id="main-content">
    <div class="sync-strip">
      <span id="sync-dot" class="sync-dot"></span>
      <span id="sync-label"></span>
    </div>

    <!-- HOME PANEL -->
    <div id="home-panel">
      <div class="stat-grid">
        <div class="stat-card">
          <div id="stat-students" class="stat-value"></div>
          <div class="stat-label" data-key="statStudents"></div>
        </div>
        <div class="stat-card">
          <div id="stat-classes" class="stat-value"></div>
          <div class="stat-label" data-key="statClassesToday"></div>
        </div>
        <div class="stat-card">
          <div id="stat-attendance" class="stat-value"></div>
          <div class="stat-label" data-key="statAttendanceToday"></div>
        </div>
        <div class="stat-card">
          <div id="stat-fees" class="stat-value"></div>
          <div class="stat-label" data-key="statPendingFees"></div>
        </div>
      </div>

      <div class="action-row">
        <button id="btn-new-student" class="action-btn">
          <span class="icon-badge"></span><span class="label"></span>
        </button>
        <button id="btn-students" class="action-btn">
          <span class="icon-badge"></span><span class="label"></span>
        </button>
        <button id="btn-attendance-home" class="action-btn">
          <span class="icon-badge"></span><span class="label"></span>
        </button>
        <button id="btn-fee-balance" class="action-btn">
          <span class="icon-badge"></span><span class="label"></span>
        </button>
        <button id="btn-pay" class="action-btn primary">
          <span class="icon-badge"></span><span class="label"></span>
        </button>
      </div>

      <h3 id="todays-classes-title" class="section-title"></h3>
      <p id="todays-classes-empty" class="placeholder-note"></p>
    </div>

<!-- ================================================================
     ATTENDANCE PANEL START
     ================================================================= -->

<section
  id="attendance-panel"
  class="app-panel"
  style="display: none;"
>
  <div class="attendance-header">
    <h2>Attendance</h2>
    <p>Select a course and mark today's attendance.</p>
  </div>

  <div class="attendance-controls">

    <div class="attendance-field">
      <label for="attendance-course">
        Course
      </label>

      <select id="attendance-course">
        <option value="">
          Select Course
        </option>
      </select>
    </div>

    <div class="attendance-field">
      <label for="attendance-date">
        Date
      </label>

      <input
        id="attendance-date"
        type="date"
      />
    </div>

  </div>

  <div id="attendance-students-list">
    <p class="attendance-empty-message">
      Select a course to view students.
    </p>
  </div>

</section>

<!-- ATTENDANCE PANEL END -->

    <!-- ================================================================
     ATTENDANCE MODAL START
     Reversible: remove this entire block to remove attendance popup.
     ================================================================ -->

<div
  id="attendance-modal"
  class="attendance-modal"
  style="display: none;"
>
  <div class="attendance-modal-backdrop"></div>

  <div
    class="attendance-modal-window"
    role="dialog"
    aria-modal="true"
  >
    <div class="attendance-modal-header">

      <div>
        <h2 id="attendance-modal-title">
          Attendance
        </h2>

        <p id="attendance-modal-course"></p>

        <p id="attendance-modal-date"></p>
      </div>

      <button
        type="button"
        id="btn-close-attendance-modal"
        class="attendance-modal-close"
        aria-label="Close attendance"
      >
        ✕
      </button>

    </div>

    <div
      id="attendance-modal-students"
      class="attendance-modal-students"
    >
      <!-- Students will appear here -->
    </div>

    <div class="attendance-modal-footer">

      <button
        type="button"
        id="btn-cancel-attendance"
        class="attendance-cancel-button"
      >
        Cancel
      </button>

      <button
        type="button"
        id="btn-save-attendance"
        class="attendance-save-button"
      >
        Save
      </button>

    </div>

  </div>
</div>

<!-- ATTENDANCE MODAL END -->
    
    <!-- PLACEHOLDER PANEL for Students / Attendance / Fees / More -->
    <div id="placeholder-panel" style="display:none;">
      <h3 class="section-title"></h3>
      <p class="placeholder-note"></p>
    </div>

<!-- STUDENT LIST FEATURE START -->
<div id="students-panel" style="display:none;">

  <div class="students-header">
    <h2>സ്റ്റുഡൻ്റ്സ്</h2>
    <span id="students-count"></span>
  </div>

  <div id="students-list"></div>

  <div id="students-empty" style="display:none;">
    <p>No students added yet.</p>
  </div>

</div>
<!-- STUDENT LIST FEATURE END -->
    
<!-- ADD STUDENT FEATURE START -->
<div id="add-student-panel" style="display:none;">

  <div class="form-header">
    <button id="btn-cancel-student" class="form-back-btn" type="button">
      ← Cancel
    </button>

    <h2>Add Student</h2>
  </div>

  <form id="add-student-form" class="student-form">

    <div class="form-group">
      <label for="student-name">വിദ്യാർത്ഥിയുടെ പേര്</label>
      <input
        id="student-name"
        type="text"
        autocomplete="name"
        required
      />
    </div>

    <div class="form-group">
      <label for="parent-name">രക്ഷിതാവിൻ്റെ പേര്</label>
      <input
        id="parent-name"
        type="text"
        required
      />
    </div>

    <div class="form-group">
      <label for="student-place">സ്ഥലം</label>
      <input
        id="student-place"
        type="text"
      />
    </div>

    <div class="form-group">
      <label for="student-phone">ഫോൺ നമ്പർ</label>
      <input
        id="student-phone"
        type="tel"
        inputmode="numeric"
        required
      />
    </div>

    <div class="form-group">
      <label for="backup-phone">2nd ഫോൺ നമ്പർ</label>
      <input
        id="backup-phone"
        type="tel"
        inputmode="numeric"
      />
    </div>

    <div class="form-group">
      <label for="student-course">കോഴ്സ്</label>
      <select id="student-course" required>
        <option value="">Select Course</option>
      </select>
    </div>

    <div class="form-group">
      <label for="admission-date">അഡ്മിഷൻ ഡേറ്റ്</label>
      <input
        id="admission-date"
        type="date"
        required
      />
    </div>

    <button
      id="btn-save-student"
      class="save-student-btn"
      type="submit"
    >
      Save
    </button>

  </form>

</div>
<!-- ADD STUDENT FEATURE END -->
    
  </main>

  <nav id="bottom-nav" class="bottom-nav"></nav>
</section>

<script src="js/lang.js"></script>
<script src="js/icons.js"></script>
<script src="js/pin.js"></script>
<script src="js/app.js"></script>
<script>
  // Fill labels that live directly in HTML via data-key
  document.querySelectorAll("[data-key]").forEach((el) => {
    el.textContent = t(el.dataset.key);
  });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

  <!-- ================================================================
     FINGERPRINT ATTENDANCE MODAL START
     ================================================================ -->

<div
  id="fingerprint-attendance-modal"
  class="fingerprint-attendance-modal"
  style="display: none;"
>
  <div class="fingerprint-attendance-backdrop"></div>

  <div class="fingerprint-attendance-window">

    <div class="fingerprint-attendance-header">
      <div>
        <span class="fingerprint-status">ATTENDANCE CHECK-IN</span>

        <h2 id="fingerprint-student-name">
          Student Name
        </h2>

        <p id="fingerprint-student-id">
          GZ-000
        </p>
      </div>

      <button
        type="button"
        id="fingerprint-cancel-top"
        class="fingerprint-close-button"
        aria-label="Close"
      >
        ×
      </button>
    </div>

    <div class="fingerprint-scanner-area">

      <div class="fingerprint-rings">
        <div class="fingerprint-ring ring-one"></div>
        <div class="fingerprint-ring ring-two"></div>
        <div class="fingerprint-ring ring-three"></div>

        <button
          type="button"
          id="fingerprint-scan-button"
          class="fingerprint-scan-button"
        >
          <span class="fingerprint-icon">
  <svg
    viewBox="0 0 64 64"
    aria-hidden="true"
    focusable="false"
  >
    <path d="M32 8C20.4 8 11 17.4 11 29c0 5.2 1.7 10.1 4.7 14.1" />
    <path d="M32 16c-7.7 0-14 6.3-14 14 0 7.5 2.3 14.4 6.2 20" />
    <path d="M32 24c-3.3 0-6 2.7-6 6 0 7.4-1.8 14.5-5.2 20.8" />
    <path d="M32 8c11.6 0 21 9.4 21 21 0 10.5-2.9 20.3-8 28" />
    <path d="M32 16c7.7 0 14 6.3 14 14 0 9.2-2.6 17.9-7.2 25" />
    <path d="M32 24c3.3 0 6 2.7 6 6 0 8.1-2.2 15.8-6.1 22.5" />
    <path d="M32 32c0 7.1-.7 14.2-3.2 20" />
  </svg>
</span>
        </button>
      </div>

      <h3 id="fingerprint-scan-title">
        Touch to Mark Present
      </h3>

      <p id="fingerprint-scan-message">
        Tap the fingerprint to confirm your attendance.
      </p>

    </div>

    <div class="fingerprint-attendance-footer">
      <button
        type="button"
        id="fingerprint-cancel-button"
        class="fingerprint-cancel-button"
      >
        Cancel
      </button>
    </div>

  </div>
</div>

<!-- FINGERPRINT ATTENDANCE MODAL END -->
  
</body>
</html>
